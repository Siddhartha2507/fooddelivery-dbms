<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Profile | FoodFlow</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>{% include "_app_nav.html" %}<main class="customer-main">{% include "_flashes.html" %}<a href="/customer">← Home</a><section class="cart-panel"><h1>Your profile</h1>{% if profile %}<form method="post" class="profile-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" value="{{ profile[0] }}" required></label><label>Email<input value="{{ profile[1] }}" disabled></label><label>Phone<input name="phone" type="tel" value="{{ profile[2] }}" required></label><label>Delivery address<textarea name="address" required>{{ profile[3] or '' }}</textarea></label><button class="primary-link">Save profile</button></form>{% endif %}</section></main>{% include "_app_footer.html" %}<script defer src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
