<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODFLOW — Sign In</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background: #020817;
            color: #fff;
            overflow: hidden;
        }

        .login-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            background:
                radial-gradient(circle at 20% 20%, rgba(14,165,233,.15), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(37,99,235,.14), transparent 35%),
                #020817;
        }

        /* ================= ANIMATION SIDE ================= */

        .visual-panel {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            border-right: 1px solid rgba(148,163,184,.12);
        }

        .visual-content {
            position: relative;
            width: min(720px, 100%);
            height: 620px;
        }

        .brand {
            position: absolute;
            top: 5px;
            left: 0;
            z-index: 20;
        }

        .brand h1 {
            font-size: 42px;
            letter-spacing: 5px;
            font-weight: 900;
            background: linear-gradient(90deg,#38bdf8,#60a5fa,#22d3ee);
            -webkit-background-clip: text;
            color: transparent;
        }

        .brand p {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .scene {
            position: absolute;
            inset: 95px 0 0;
            overflow: hidden;
            border-radius: 32px;
            background:
                linear-gradient(180deg,rgba(15,23,42,.45),rgba(2,8,23,.95)),
                radial-gradient(circle at 50% 35%,rgba(14,165,233,.15),transparent 45%);
            border: 1px solid rgba(56,189,248,.12);
            box-shadow: inset 0 0 80px rgba(14,165,233,.05);
        }

        /* floating particles */

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 15px #38bdf8;
            opacity: .45;
            animation: floatParticle 6s infinite ease-in-out;
        }

        .p1 { left: 12%; top: 20%; animation-delay: 0s; }
        .p2 { left: 25%; top: 65%; animation-delay: 1s; }
        .p3 { left: 48%; top: 18%; animation-delay: 2s; }
        .p4 { left: 76%; top: 28%; animation-delay: 3s; }
        .p5 { left: 88%; top: 68%; animation-delay: 4s; }

        @keyframes floatParticle {
            0%,100% { transform: translateY(0) scale(1); opacity:.25; }
            50% { transform: translateY(-35px) scale(1.5); opacity:.8; }
        }

        /* food */

        .food {
            position: absolute;
            font-size: 45px;
            filter: drop-shadow(0 0 14px rgba(56,189,248,.3));
            animation: foodFloat 3s ease-in-out infinite;
            z-index: 5;
        }

        .food1 { left: 17%; top: 28%; animation-delay: 0s; }
        .food2 { left: 31%; top: 20%; animation-delay: .7s; }
        .food3 { left: 44%; top: 30%; animation-delay: 1.4s; }

        @keyframes foodFloat {
            0%,100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-15px) rotate(4deg); }
        }

        /* kitchen */

        .kitchen {
            position: absolute;
            left: 8%;
            bottom: 100px;
            width: 43%;
            height: 120px;
            border-radius: 18px;
            background: linear-gradient(145deg,#111c31,#07101f);
            border: 1px solid rgba(148,163,184,.15);
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .kitchen-top {
            height: 18px;
            background: linear-gradient(90deg,#1e293b,#334155,#1e293b);
            border-radius: 18px 18px 4px 4px;
        }

        .pan {
            position: absolute;
            width: 65px;
            height: 25px;
            border-radius: 50%;
            background: #0f172a;
            border: 3px solid #475569;
            left: 55px;
            top: 28px;
            animation: panMove 2.5s infinite ease-in-out;
        }

        .pan:after {
            content: "";
            position: absolute;
            width: 38px;
            height: 7px;
            right: -35px;
            top: 7px;
            border-radius: 8px;
            background: #475569;
        }

        @keyframes panMove {
            0%,100% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(-8deg) translateY(-7px); }
        }

        .steam {
            position: absolute;
            left: 75px;
            top: 0;
            width: 8px;
            height: 50px;
            border-radius: 50%;
            border-left: 3px solid rgba(255,255,255,.3);
            filter: blur(1px);
            animation: steam 2s infinite ease-in-out;
        }

        @keyframes steam {
            0% { transform: translateY(20px) scale(.6); opacity:0; }
            50% { opacity:.7; }
            100% { transform: translateY(-25px) translateX(10px) scale(1.2); opacity:0; }
        }

        /* community building */

        .building {
            position: absolute;
            right: 8%;
            bottom: 100px;
            width: 190px;
            height: 185px;
            border-radius: 16px 16px 5px 5px;
            background: linear-gradient(145deg,#172554,#0f172a);
            border: 1px solid rgba(96,165,250,.25);
            box-shadow: 0 20px 60px rgba(37,99,235,.12);
        }

        .building:before {
            content: "COMMUNITY";
            position: absolute;
            top: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: #7dd3fc;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .window {
            position: absolute;
            width: 25px;
            height: 28px;
            border-radius: 5px;
            background: #38bdf8;
            box-shadow: 0 0 15px rgba(56,189,248,.35);
            animation: windowGlow 2.5s infinite alternate;
        }

        .w1 { left: 30px; top: 55px; }
        .w2 { left: 82px; top: 55px; animation-delay:.5s; }
        .w3 { left: 135px; top: 55px; animation-delay:1s; }
        .w4 { left: 30px; top: 105px; animation-delay:1.2s; }
        .w5 { left: 82px; top: 105px; animation-delay:.3s; }
        .w6 { left: 135px; top: 105px; animation-delay:.8s; }

        @keyframes windowGlow {
            from { opacity:.35; }
            to { opacity:1; }
        }

        /* road */

        .road {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 45px;
            height: 55px;
            background: #080f1d;
            border-top: 1px solid #1e293b;
            border-bottom: 1px solid #1e293b;
        }

        .road-line {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            height: 3px;
            background: repeating-linear-gradient(
                90deg,
                #475569 0 55px,
                transparent 55px 100px
            );
            animation: roadMove 1.5s linear infinite;
        }

        @keyframes roadMove {
            to { transform: translateX(-100px); }
        }

        /* scooter */

        .scooter {
            position: absolute;
            bottom: 59px;
            left: -100px;
            z-index: 10;
            animation: deliveryRide 7s infinite cubic-bezier(.65,0,.35,1);
        }

        .scooter-body {
            position: relative;
            width: 80px;
            height: 42px;
            border-radius: 25px 35px 10px 15px;
            background: linear-gradient(135deg,#0ea5e9,#2563eb);
            box-shadow: 0 0 25px rgba(14,165,233,.45);
        }

        .scooter-seat {
            position: absolute;
            width: 35px;
            height: 8px;
            left: 20px;
            top: -8px;
            border-radius: 10px;
            background: #111827;
        }

        .scooter-wheel {
            position: absolute;
            bottom: -15px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #020617;
            border: 5px solid #64748b;
            animation: wheelSpin .7s linear infinite;
        }

        .wheel1 { left: 8px; }
        .wheel2 { right: 5px; }

        @keyframes wheelSpin {
            to { transform: rotate(360deg); }
        }

        .box {
            position: absolute;
            width: 28px;
            height: 27px;
            right: 4px;
            top: -27px;
            border-radius: 5px;
            background: linear-gradient(135deg,#f59e0b,#d97706);
            box-shadow: 0 0 15px rgba(245,158,11,.35);
        }

        .box:after {
            content: "F";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #fff;
        }

        @keyframes deliveryRide {
            0% { left: -110px; }
            65% { left: 58%; }
            78% { left: 72%; }
            88% { left: 78%; }
            100% { left: 115%; }
        }

        /* delivery route */

        .route {
            position: absolute;
            left: 20%;
            right: 20%;
            bottom: 125px;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                #38bdf8 0 10px,
                transparent 10px 18px
            );
            opacity: .25;
            animation: routePulse 2s infinite;
        }

        @keyframes routePulse {
            50% { opacity:.75; box-shadow:0 0 15px #38bdf8; }
        }

        .status {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            letter-spacing: 1.5px;
        }

        /* ================= LOGIN ================= */

        .login-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px;
        }

        .login-card {
            width: min(430px, 100%);
            padding: 42px;
            border-radius: 28px;
            background: rgba(15,23,42,.72);
            border: 1px solid rgba(148,163,184,.14);
            box-shadow: 0 30px 90px rgba(0,0,0,.45);
            backdrop-filter: blur(20px);
        }

        .login-card h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid #263449;
            background: #081120;
            color: white;
            outline: none;
            transition: .25s;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,.1);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 55px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: none;
            color: #64748b;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        .remember {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(90deg,#0284c7,#2563eb,#06b6d4);
            color: white;
            font-weight: 800;
            letter-spacing: .5px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(14,165,233,.25);
            transition: .25s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(14,165,233,.4);
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }

        .register a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
        }

        .error {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(239,68,68,.1);
            border: 1px solid rgba(239,68,68,.25);
            color: #fca5a5;
            font-size: 13px;
        }

        /* mobile */

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .login-page {
                grid-template-columns: 1fr;
            }

            .visual-panel {
                min-height: 390px;
                padding: 25px;
            }

            .visual-content {
                height: 350px;
            }

            .scene {
                inset: 75px 0 0;
            }

            .brand h1 {
                font-size: 30px;
            }

            .building {
                transform: scale(.72);
                transform-origin: bottom right;
            }

            .kitchen {
                transform: scale(.72);
                transform-origin: bottom left;
            }

            .food {
                font-size: 32px;
            }

            .login-panel {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="login-page">

    <!-- ANIMATED FOODFLOW SCENE -->
    <section class="visual-panel">
        <div class="visual-content">

            <div class="brand">
                <h1>FOODFLOW</h1>
                <p>SMART FOOD • SMART DELIVERY</p>
            </div>

            <div class="scene">

                <div class="particle p1"></div>
                <div class="particle p2"></div>
                <div class="particle p3"></div>
                <div class="particle p4"></div>
                <div class="particle p5"></div>

                <div class="food food1">🍔</div>
                <div class="food food2">🍕</div>
                <div class="food food3">🍜</div>

                <div class="kitchen">
                    <div class="kitchen-top"></div>
                    <div class="pan"></div>
                    <div class="steam"></div>
                </div>

                <div class="route"></div>

                <div class="building">
                    <div class="window w1"></div>
                    <div class="window w2"></div>
                    <div class="window w3"></div>
                    <div class="window w4"></div>
                    <div class="window w5"></div>
                    <div class="window w6"></div>
                </div>

                <div class="road">
                    <div class="road-line"></div>
                </div>

                <div class="scooter">
                    <div class="box"></div>
                    <div class="scooter-body">
                        <div class="scooter-seat"></div>
                        <div class="scooter-wheel wheel1"></div>
                        <div class="scooter-wheel wheel2"></div>
                    </div>
                </div>

                <div class="status">
                    ORDER → PREPARE → DELIVER → ENJOY
                </div>

            </div>
        </div>
    </section>

    <!-- LOGIN -->
    <section class="login-panel">
        <div class="login-card">

            <h2>Welcome back 👋</h2>
            <p class="subtitle">Sign in to continue to your FOODFLOW account.</p>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" class="login-form" id="loginForm">

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >👁</button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="login-btn" id="loginButton">
                    Sign In
                </button>

            </form>

            <div class="register">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create account</a>
            </div>

        </div>
    </section>

</div>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    togglePassword.addEventListener("click", function () {
        const isPassword = password.type === "password";

        password.type = isPassword ? "text" : "password";
        togglePassword.textContent = isPassword ? "🙈" : "👁";
    });

    loginForm.addEventListener("submit", function () {
        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";
    });
</script>

</body>
</html>
