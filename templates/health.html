<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System health | FOODFLOW</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>{% include "_app_nav.html" %}<main class="customer-main"><span class="login-eyebrow">LIVE SERVICE CHECKS</span><h1 class="page-heading">System health</h1><div class="health-list">{% for service,status in state.items() %}<div class="health-row"><strong>{{ service }}</strong><span class="health-status {% if status=='CONNECTED' %}good{% else %}offline{% endif %}">{{ status }}</span></div>{% endfor %}</div><p class="muted">Embeddings reflect rows currently stored in PostgreSQL; search capability also depends on the model being available.</p></main>{% include "_app_footer.html" %}<script defer src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
