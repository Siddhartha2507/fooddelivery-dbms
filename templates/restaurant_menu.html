<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Manage menu | FoodFlow</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/foodflow-animations.css') }}"></head><body>{% include "_app_nav.html" %}<main class="customer-main">{% include "_flashes.html" %}<h1 class="page-heading">Menu management</h1><section class="cart-panel"><h2>Add a menu item</h2><form method="post" class="menu-add-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Item name<input name="item_name" maxlength="120" required></label><label>Price (₹)<input name="price" type="number" min="0.01" step="0.01" required></label><label><input type="checkbox" name="availability" checked> Available</label><button class="primary-link">Add item</button></form></section><div class="menu-management-list">{% for item_id,name,price,available in items %}<form method="post" action="/restaurant/menu/{{ item_id }}" class="menu-edit-row"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><strong>#{{ item_id }}</strong><input name="item_name" value="{{ name }}" required><input name="price" type="number" min="0.01" step="0.01" value="{{ price }}" required><label><input type="checkbox" name="availability" {% if available %}checked{% endif %}> Available</label><button class="small-primary">Save</button></form>{% else %}<p class="empty-state">No menu items yet.</p>{% endfor %}</div></main>{% include "_app_footer.html" %}<script defer src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
